<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racecourse</title>
<meta name="description" content="Organizzazione dei campi di regata: squadre, boe, bandiere e percorsi.">
<meta name="theme-color" content="#0F2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Racecourse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
:root{
  --bg:#F3F6F9; --card:#FFFFFF; --ink:#0F2740; --muted:#5A6B7E; --line:#D5DEE8;
  --red:#C8102E; --blue:#1D4E9E; --yellow:#F5C400; --ok:#1E7A4C; --tap:#E6EEF6; --field:#F7F9FB;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1D31; --card:#12304F; --ink:#EAF1F8; --muted:#9DB1C5; --line:#22476C;
    --red:#E0394F; --blue:#5B8BE0; --ok:#4CC488; --tap:#1A3B5E; --field:#0F2843;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1D31; --card:#12304F; --ink:#EAF1F8; --muted:#9DB1C5; --line:#22476C;
  --red:#E0394F; --blue:#5B8BE0; --ok:#4CC488; --tap:#1A3B5E; --field:#0F2843;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:38px;line-height:1.05}
h2{font-size:24px;line-height:1.15;margin:28px 0 10px}
h3{font-size:21px}
.muted{color:var(--muted)}
svg.fl{display:block;flex:none}

/* home */
.top{padding:24px 0 6px}
.evname{width:100%;border:0;background:transparent;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:38px;line-height:1.1;padding:0;color:var(--ink)}
.evname::placeholder{color:var(--muted);opacity:.7}
.stepper{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:16px}
.stepper .lbl{font-weight:600}
.stepper .lbl span{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.stepper .ctl{margin-left:auto;display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--tap);font-size:24px;font-weight:600;cursor:pointer}
.stepper button:disabled{opacity:.35}
.stepper b{font-family:"Barlow Condensed",sans-serif;font-size:34px;min-width:30px;text-align:center}
.fields{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.fields a{display:flex;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.fields a:active{background:var(--tap)}
.fields .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;line-height:1}
.fields .cl{color:var(--muted);font-size:15px;margin-top:3px}
.fields .ch{margin-left:auto;text-align:right}
.fields .ch b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1}
.fields .ch span{font-size:13px;color:var(--muted)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.links a{display:block;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;font-weight:600}
.links a span{display:block;font-weight:400;font-size:14px;color:var(--muted)}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.back{text-decoration:none;font-weight:600;padding:6px 8px 6px 0;color:var(--blue)}
.bar .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;margin-left:auto}
.hero{display:flex;gap:16px;align-items:center;padding:20px 0 4px}
.tabs{display:flex;gap:3px;margin:16px 0 0;background:var(--tap);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 1px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer}
.map{position:relative;margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#D7E8F4;user-select:none;-webkit-user-select:none}
.map img{display:block;width:100%;height:auto;pointer-events:none;-webkit-touch-callout:none}
.map.blank{aspect-ratio:3/4;background-image:linear-gradient(rgba(29,78,158,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(29,78,158,.08) 1px,transparent 1px);background-size:32px 32px}
.mapempty{position:absolute;inset:auto 0 12px;text-align:center;color:#5A6B7E;font-size:14px}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:grab;padding:4px;z-index:1}
.mk b{font:700 14px/1.2 "Barlow Condensed",sans-serif;background:#fff;color:#0F2740;border-radius:4px;padding:0 4px;margin-top:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.25);white-space:nowrap}
.mk.drag{cursor:grabbing;z-index:3}
.mk.drag svg{transform:scale(1.15)}
.mk svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
label.btn input{display:none}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.arw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.arw .hit{pointer-events:stroke;cursor:pointer}
.map.drawing{touch-action:none;cursor:crosshair}
.map.drawing .arw .hit{pointer-events:none}
.mk.boa{z-index:2}
.bd{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.45)}
.bd.robo{border-radius:6px}
.mk.sel .bd{outline:3px solid #1D4E9E;outline-offset:2px}
.hd{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(29,78,158,.25);border:2px solid #1D4E9E;touch-action:none;z-index:4;cursor:grab}
.seg{display:flex;gap:4px;background:var(--tap);padding:4px;border-radius:12px;margin-top:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 0 var(--line)}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--blue);border-radius:12px}
.selbar .n{font-weight:600;margin-right:auto}
.selbar .btn{padding:8px 12px}
.btn.del{color:var(--red)}
.mk.sel svg{outline:3px solid #1D4E9E;outline-offset:3px;border-radius:6px}
.hd.mid{background:rgba(245,196,0,.35);border-color:#B88F00}
.qadd{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:4px}
.qadd .btn{display:flex;align-items:center;gap:10px;text-align:left;font-size:15px}
.qadd svg{flex:none}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 0 var(--line)}

/* moduli */
.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.sec{padding:12px 14px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.r{font-size:13px;color:var(--muted)}
.inp{width:100%;border:1px solid transparent;border-bottom-color:var(--line);background:var(--field);border-radius:8px 8px 0 0;padding:9px 10px;font-size:17px;min-width:0}
.inp:focus{outline:none;border-color:var(--blue);border-radius:8px}
.inp::placeholder{color:var(--muted);opacity:.75}
.pp .pr{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.pp .pr .nm{flex:1 1 200px}
.pp .pr .tl{flex:1 1 130px;display:flex;gap:8px;align-items:center}
.call{flex:none;display:inline-flex;align-items:center;text-decoration:none;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--blue);color:#fff;font-size:15px}
.call[hidden]{display:none}
.kv2{display:grid;grid-template-columns:1fr 110px;gap:10px}
.mzh{display:flex;align-items:center;gap:8px}
.mzh .inp{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;background:transparent;padding:4px 6px}
.tag{flex:none;font-size:13px;color:var(--muted);background:var(--tap);padding:3px 8px;border-radius:999px}
.x{flex:none;border:0;background:none;color:var(--red);font-weight:600;cursor:pointer;padding:8px 6px;font-size:15px}
.x.armed{background:var(--red);color:#fff;border-radius:8px}
.add{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;font-weight:600;color:var(--blue);cursor:pointer;text-align:center}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow select{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px}
.addrow button{flex:none;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;padding:10px 16px;cursor:pointer}
textarea.inp{min-height:80px;resize:vertical}

/* liste spunta */
.pick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-top:14px;scrollbar-width:none}
.pick button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:15px}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{display:flex;align-items:center;gap:10px;margin:10px 0 0}
.prog .track{flex:1;height:8px;background:var(--tap);border-radius:8px;overflow:hidden}
.prog .fill{height:100%;background:var(--ok);transition:width .2s}
.chk{display:flex;gap:12px;align-items:center;padding:8px 10px 8px 14px;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);flex:none;margin:0}
.chk .inp{background:transparent;border-bottom-color:transparent}
.chk.done .inp,.chk.done .fn{color:var(--muted);text-decoration:line-through}
.chk .fn{flex:1}
.chk .fn small{display:block;color:var(--muted);font-size:13px;text-decoration:none}
.lnk{background:none;border:0;color:var(--red);font-weight:600;padding:8px 0;cursor:pointer;margin-top:8px}
.empty{padding:18px 14px;color:var(--muted)}

/* boe */
.brow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.brow:first-child{border-top:0}
.dot{width:28px;height:28px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.dot.robo{border-radius:7px}
.brow .lb{width:90px;flex:none}
.brow select{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:8px}
.brow .qt{width:56px;flex:none;text-align:center}
.brow label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.tot{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700}

/* archivio */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:center;font-size:14px;line-height:1.2}
.tile[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card));box-shadow:inset 0 0 0 1px var(--ok)}
.tile .s{font-size:12px;color:var(--muted)}
.arow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .n{font-weight:600}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,15,28,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{background:var(--bg);width:100%;max-width:640px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;padding:14px 0 10px;z-index:1;border-bottom:1px solid var(--line)}
.sheet .head button{margin-left:auto;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;padding:9px 18px;cursor:pointer}
.sheet h3{margin-top:16px}

/* tabelle */
.tw{overflow-x:auto;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 4px;text-align:center;border-top:1px solid var(--line)}
thead th{border-top:0}
th:first-child,td:first-child{text-align:left;padding-left:12px;line-height:1.2}
th:last-child,td:last-child{padding-right:12px}
tbody th{font-weight:600;font-size:14px}
tfoot th,tfoot td{font-weight:700}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-weight:600}
.status{margin-top:28px;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.sh i{background:var(--ok)}
.status.ro i{background:var(--red)}
.status a{color:var(--blue);font-weight:600}
.brand{display:flex;align-items:center;gap:10px;padding-top:18px}
.brand img{width:28px;height:28px;border-radius:7px}
.brand b{font:700 15px/1 "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase}
.brand .lang{margin-left:auto;display:flex;gap:2px;background:var(--tap);padding:3px;border-radius:9px}
.brand .lang button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer}
.brand .lang button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 0 var(--line)}
.top{padding-top:10px}
.foot{margin-top:18px;font-size:13px;color:var(--muted)}
.foot a{color:inherit}
.install{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px}
.install b{display:block;margin-bottom:2px}
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .box{width:100%;max-width:360px;text-align:center}
.gate img{width:84px;height:84px;border-radius:20px;margin-bottom:14px}
.gate h1{font-size:34px}
.gate p{color:var(--muted);margin:8px 0 18px}
.gate .inp{text-align:center;font-size:22px;letter-spacing:.12em;text-transform:uppercase;border-radius:10px;border:1px solid var(--line)}
.gate .pri{width:100%;margin-top:10px;padding:13px;font-size:17px}
.gate .err{color:var(--red);margin:10px 0 0;min-height:1.4em}
.gate .gl{display:inline-flex;margin-top:18px;gap:2px;background:var(--tap);padding:3px;border-radius:9px}
.gate .gl button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-weight:600;cursor:pointer}
.gate .gl button[aria-pressed="true"]{background:var(--card)}
.cprev{display:flex;justify-content:center;padding:18px 0 8px}
.cprev svg{filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
.layouts{display:flex;gap:8px;flex-wrap:wrap}
.layouts button{border:2px solid transparent;background:var(--card);border-radius:10px;padding:6px;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.layouts button[aria-pressed="true"]{border-color:var(--blue)}
.layouts svg{display:block}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;font-size:16px;color:var(--ink)}
.blk .crow:first-child{border-top:0}
label.crow{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px}
.crow .l{margin-right:auto;font-weight:600}
.sw{display:inline-block;width:28px;height:28px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);flex:none}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:8px}
.swb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:12px;color:var(--ink)}
.swb[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.swb .sw{width:40px;height:26px}
.cropbox{position:relative;width:280px;height:280px;margin:14px auto 0;overflow:hidden;border:2px solid var(--blue);touch-action:none;cursor:grab}
.cropbox img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;transform-origin:center}
.zoom{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-weight:600}
.zoom input{flex:1}
.crow input[type=color]{width:46px;height:32px;border:0;background:none;padding:0}
.crow input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
.clink{text-decoration:none;align-items:center;color:inherit}
.clink .chev{margin-left:auto;font-size:26px;color:var(--muted)}
.lg{border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<script>
/* ---------- lingua ---------- */

/* file: condividi su telefono, altrimenti scarica */
async function saveFile(blob, name){
  try{
    const file = new File([blob], name, {type: blob.type});
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:name}); return "ok"; }
      catch(e){ if (e && e.name==="AbortError") return "cancel"; }
    }
  }catch(e){}
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 5000);
  return "ok";
}

/* backup */
let bkMsg = "", pendingImport = null;
async function exportBackup(){
  const data = {app:"racecourse", v:1, date:new Date().toISOString(), data:S, imgs:IMGS};
  const slug = (S.config.nome||"evento").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "evento";
  const r = await saveFile(new Blob([JSON.stringify(data)],{type:"application/json"}), `racecourse-${slug}-${new Date().toISOString().slice(0,10)}.json`);
  bkMsg = r==="ok" ? t("Backup salvato.") : ""; render();
}
function readBackup(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{ const d = JSON.parse(fr.result); if (d.app!=="racecourse" || !d.data || !d.data.config) throw 0; pendingImport = d; bkMsg = ""; }
    catch(e){ pendingImport = null; bkMsg = t("Questo file non è un backup di Racecourse."); }
    render();
  };
  fr.readAsText(file);
}
function applyBackup(){
  const d = pendingImport; if (!d) return;
  CAMPI.forEach(([k])=>{ delete IMGS[k]; try{ localStorage.removeItem("racecourse-img-"+k); }catch(e){} });
  S = {config:Object.assign(defConfig(), d.data.config)}; CAMPI.forEach(([k])=>S[k]=d.data[k]||null);
  for (const k in (d.imgs||{})){ if (!S.hasOwnProperty(k)) continue; IMGS[k]=d.imgs[k]; try{ localStorage.setItem("racecourse-img-"+k,d.imgs[k]); }catch(e){ storageFull=true; } }
  cacheLocal(); pendingImport = null; bkMsg = t("Backup importato."); location.hash = ""; render();
}

      <div class="kv2" style="margin-top:6px"><div><div class="r">${t("Imbarcazione")}</div>${inp(k,`mezzi.${i}.barca`,t("Nome o modello della barca"))}</div><div><div class="r">${t("Sigla")}</div>${inp(k,`mezzi.${i}.sigla`,sigla(m))}</div></div></div>
      ${person(k,`mezzi.${i}.resp`,t("Responsabile"))}${person(k,`mezzi.${i}.ass`,m.tipo==="rc"?t("Aiuto"):t("Assistente"))}</div>`;

const BCOL = [["","Colore…"],["arancione","#F07A12"],["gialla","#F5C400"],["rossa","#D7263D"],["blu","#1D4E9E"],["verde","#2E8B3A"],["viola","#7B3FA0"],["bianca","#FFFFFF"],["nera","#1A1A1A"],["rosa","#E85A9B"]];
const bhex = c => c ? (BCOL.find(x=>x[0]===c)||[,"transparent"])[1] : "transparent";
function paneBoe(k,f){

function mezzoPicker(f){
  if (!selM || !f.mezzi.find(m=>m.id===selM)) selM = f.mezzi[0] && f.mezzi[0].id;
  return `<div class="pick" role="group" aria-label="${t("Scegli il mezzo")}">${f.mezzi.map(m=>`<button data-sel="${m.id}" aria-pressed="${m.id===selM}">${esc((m.nome||TIPI[m.tipo]).replace(" + assistenza partenza","").replace(" + start support",""))}</button>`).join("")}</div>`;
}
const prog = (a,b) => `<div class="prog"><div class="track"><div class="fill" style="width:${b?100*a/b:0}%"></div></div><span class="muted">${a} ${t("di")} ${b}</span></div>`;

function paneDot(k,f){
  if (!f.mezzi.length) return `<div class="empty">${t("Aggiungi un mezzo nella scheda Squadra.")}</div>`;
  const pick = mezzoPicker(f), i = f.mezzi.findIndex(m=>m.id===selM), m = f.mezzi[i];
  const done = m.dot.filter(x=>x.ok).length;
  return pick + prog(done,m.dot.length) + `<div class="blk">${m.dot.map((x,j)=>`<div class="chk${x.ok?" done":""}">

function paneBand(k,f){

function addOpts(sel){ return Object.entries(TIPI).filter(([t])=>t!=="terra").map(([t,l])=>`<option value="${t}" ${t===sel?"selected":""}>${l}</option>`).join(""); }
let mapMode = "move", mapSel = null, drawing = null;
const splitL = l => String(l||"").split(/[,;/]+/).map(s=>s.trim()).filter(Boolean);
function boaInfo(f,l,fb){ const b = (f.boe||[]).find(b=>splitL(b.l).includes(l)); return b ? {c:b.c,robo:b.robo} : (fb||{c:"",robo:false}); }
const pct = v => (v*100).toFixed(2)+"%";
const ctrl = a => a.cx!=null ? [a.cx,a.cy] : [(a.x1+a.x2)/2,(a.y1+a.y2)/2];
const midA = a => { const [cx,cy]=ctrl(a); return [(a.x1+2*cx+a.x2)/4,(a.y1+2*cy+a.y2)/4]; };
function layoutArrows(){
  const map = document.getElementById("map"); if (!map) return;
  const svg = map.querySelector("svg.arw"), g = svg && svg.querySelector("#arws"); if (!g) return;
  const w = map.clientWidth, h = map.clientHeight; if (!w || !h) return;
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  const k = map.dataset.k, f = campo(k), sel = mapSel && mapSel.k===k && mapSel.type==="ar" ? mapSel.id : null;
  g.innerHTML = (f.arrows||[]).map(a=>{ const [cx,cy]=ctrl(a), s=a.id===sel;
    const d = `M${(a.x1*w).toFixed(1)} ${(a.y1*h).toFixed(1)}Q${(cx*w).toFixed(1)} ${(cy*h).toFixed(1)} ${(a.x2*w).toFixed(1)} ${(a.y2*h).toFixed(1)}`;
    return `<g data-ar="${a.id}"><path class="hit" d="${d}" fill="none" stroke="transparent" stroke-width="26"/><path d="${d}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${s?"#1D4E9E":"#13294B"}" stroke-width="3" stroke-linecap="round" marker-end="url(#${s?"ahs":"ah"})"/></g>`; }).join("");
  map.querySelectorAll(".hd").forEach(hd=>{ const a=(f.arrows||[]).find(x=>x.id===hd.dataset.ar); if (!a) return;
    const p = hd.dataset.end==="m" ? midA(a) : [a["x"+hd.dataset.end], a["y"+hd.dataset.end]]; hd.style.left=pct(p[0]); hd.style.top=pct(p[1]); });
}
window.addEventListener("resize", ()=>layoutArrows());
function panePerc(k,f){
  const pos = f.pos||{}, src = imgSrc(k,f), marks = f.marks||[], arrows = f.arrows||[];
  const sel = mapSel && mapSel.k===k ? mapSel : null;
  const mz = f.mezzi.filter(m=>m.tipo!=="terra");
  const placed = mz.filter(m=>pos[m.id]), free = mz.filter(m=>!pos[m.id]);
  const used = new Set(marks.map(m=>m.l));
  const freeB = []; (f.boe||[]).forEach(b=>splitL(b.l).forEach(l=>{ if(!used.has(l)) freeB.push({l,c:b.c,robo:b.robo}); }));
  const drawMode = mapMode==="arrow" && !readOnly;
  const bcol = c => bhex(c)==="transparent" ? "#BBB" : bhex(c);
  let h = readOnly ? "" : `<div class="seg" role="group" aria-label="${t("Modalità")}"><button data-act="mode" data-v="move" aria-pressed="${!drawMode}">${t("Sposta e seleziona")}</button><button data-act="mode" data-v="arrow" aria-pressed="${drawMode}">${t("Disegna frecce")}</button></div>`;
  // barra dell'oggetto selezionato, sopra la mappa
  if (sel && !readOnly){
    if (sel.type==="ar" && arrows.some(a=>a.id===sel.id)){ const a = arrows.find(x=>x.id===sel.id);
      h += `<div class="selbar"><span class="n">${t("Freccia")}</span><button class="btn" data-act="flipAr">${t("Inverti verso")}</button>${a.cx!=null?`<button class="btn" data-act="straight">${t("Raddrizza")}</button>`:""}<button class="btn del" data-act="rmSel">${t("Togli dal grafico")}</button></div>`; }
    else if (sel.type==="boa" && marks.some(m=>m.id===sel.id)){ const m = marks.find(x=>x.id===sel.id);
      h += `<div class="selbar"><span class="n">${t("Boa")} ${esc(m.l)}</span><button class="btn del" data-act="rmSel">${t("Togli dal grafico")}</button></div>`; }
    else if (sel.type==="boat" && pos[sel.id]){ const m = f.mezzi.find(x=>x.id===sel.id);
      if (m) h += `<div class="selbar"><span class="n">${esc(m.nome||TIPI[m.tipo])}</span><button class="btn" data-act="openMz" data-id="${m.id}">${t("Apri scheda")}</button><button class="btn del" data-act="rmSel">${t("Togli dal grafico")}</button></div>`; }
  }
  h += `<div class="map${src?"":" blank"}${drawMode?" drawing":""}" id="map" data-k="${k}">${src?`<img src="${src}" alt="Percorso del campo" onload="layoutArrows()">`:`<div class="mapempty">${uploading===k?t("Caricamento dell’immagine…"):t("Carica l’immagine del percorso, oppure lavora sulla griglia")}</div>`}
    <svg class="arw" aria-hidden="true"><defs>
      <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#13294B" stroke="#fff" stroke-width="1"/></marker>
      <marker id="ahs" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1D4E9E" stroke="#fff" stroke-width="1"/></marker></defs>
      <g id="arws"></g>
      <path id="prev" d="M0 0" fill="none" stroke="#1D4E9E" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" visibility="hidden"/>
    </svg>
    ${marks.map(m=>{const b=boaInfo(f,m.l,m); return `<div class="mk boa${sel&&sel.type==="boa"&&sel.id===m.id?" sel":""}" data-bk="${m.id}" style="left:${pct(m.x)};top:${pct(m.y)}" role="button" aria-label="${t("Boa")} ${esc(m.l)}"><span class="bd${b.robo?" robo":""}" style="background:${bcol(b.c)}"></span><b>${esc(m.l)}</b></div>`;}).join("")}
    ${placed.map(m=>`<div class="mk${sel&&sel.type==="boat"&&sel.id===m.id?" sel":""}" data-mk="${m.id}" style="left:${pct(pos[m.id].x)};top:${pct(pos[m.id].y)}" role="button" aria-label="${esc(m.nome)}">${boatSVG(m.tipo)}<b>${esc(sigla(m))}</b></div>`).join("")}
    ${sel&&sel.type==="ar"&&!readOnly&&arrows.some(a=>a.id===sel.id)?["1","m","2"].map(e=>`<div class="hd${e==="m"?" mid":""}" data-ar="${sel.id}" data-end="${e}"></div>`).join(""):""}
  </div>`;
  h += `<p class="hint">${readOnly?t("Tocca un mezzo per vederne la scheda."):drawMode?t("Disegna col dito il percorso, dritto o curvo, partendo dall’inizio verso la direzione di percorrenza."):sel&&sel.type==="ar"?t("Trascina i cerchi alle estremità per spostare la freccia e quello centrale per curvarla."):t("Trascina gli oggetti per spostarli. Toccane uno per selezionarlo e toglierlo dal grafico.")}</p>`;
  if (!readOnly){
    h += `<div class="btnrow"><label class="btn${src?"":" pri"}">${uploading===k?t("Caricamento…"):src?t("Sostituisci immagine"):t("Carica immagine percorso")}<input type="file" accept="image/*" data-up="${k}"></label>${src?xbtn("rmImg","",t("Rimuovi immagine")):""}${arrows.length?xbtn("rmAllAr","",t("Cancella tutte le frecce")):""}</div>
      ${upMsg?`<p style="color:var(--red)">${esc(upMsg)}</p>`:""}
      <h2>${t("Boe")}</h2>
      ${freeB.length?`<div class="pick" style="flex-wrap:wrap">${freeB.map(b=>`<button data-act="placeBoa" data-l="${esc(b.l)}"><span class="bd${b.robo?" robo":""}" style="display:inline-block;vertical-align:-5px;margin-right:6px;width:18px;height:18px;background:${bcol(b.c)}"></span>${esc(b.l)}</button>`).join("")}</div><p class="hint">${t("Tocca una boa per metterla sul percorso. Nomi e colori si cambiano nella scheda Boe.")}</p>`
        :`<p class="hint">${(f.boe||[]).length?t("Tutte le boe sono sul percorso."):t("Aggiungi le boe nella scheda Boe.")}</p>`}
      <h2>${t("Aggiungi un mezzo")}</h2>
      <div class="qadd">${["rc","cs","ar","gp","ga"].map(t=>`<button class="btn" data-act="addMk" data-t="${t}">${boatSVG(t,15)}<span>${TIPI[t]}</span></button>`).join("")}</div>
      <p class="hint">${t("Il mezzo compare sull’immagine e si apre la sua scheda da compilare.")}</p>`;
    if (free.length) h += `<h2>${t("Mezzi da posizionare")}</h2><div class="pick" style="flex-wrap:wrap">${free.map(m=>`<button data-act="place" data-id="${m.id}">${esc(m.nome)}</button>`).join("")}</div>`;
  }
  return h;
}

/* immagini */
function loadImg(file){ return new Promise((ok,ko)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ok(im);}; im.onerror=ko; im.src=u; }); }
function toCanvas(im,max){ const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(im.naturalWidth*s); c.height=Math.round(im.naturalHeight*s); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); return c; }
function shrinkToData(im){
  let url = "";
  for (const [mx,q] of [[1400,.72],[1100,.66],[900,.6],[700,.55]]){ url = toCanvas(im,mx).toDataURL("image/jpeg",q); if (url.length<240000) return url; }
  return "";
}
async function uploadImg(k,file){
  uploading=k; upMsg=""; render();
  try{
    const im = await loadImg(file), f = campo(k), url = shrinkToData(im);
    if (!url) throw new Error("big");
    IMGS[k]=url; f.img={doc:true};
    try{ localStorage.setItem("racecourse-img-"+k,url); }catch(e){ upMsg="Immagine troppo grande per essere salvata su questo dispositivo."; }
    touch(k);
  }catch(e){ upMsg = t("Questo file non è un’immagine leggibile. Prova con un JPG o un PNG."); }
  uploading=null; render();
}
async function classImg(i,file){
  try{ const im = await loadImg(file), c = S.config.classi[i]; if (!c) return;
    c.img = toCanvas(im,300).toDataURL("image/jpeg",.85); touch("config"); render(); }catch(e){}
}

let drag = null;
function mapXY(e,R){ return [Math.min(.99,Math.max(.01,(e.clientX-R.left)/R.width)), Math.min(.99,Math.max(.01,(e.clientY-R.top)/R.height))]; }
const r4 = v => +(+v).toFixed(4);
document.addEventListener("pointerdown", e=>{
  const map = e.target.closest("#map"); if (!map) return;
  const k = map.dataset.k, R = map.getBoundingClientRect();
  const mk = e.target.closest(".mk, .hd");
  if (mk){
    e.preventDefault();
    drag = {el:mk, k, sx:e.clientX, sy:e.clientY, moved:false, rect:R,
      type: mk.dataset.mk ? "boat" : mk.dataset.bk ? "boa" : "hd",
      id: mk.dataset.mk || mk.dataset.bk || mk.dataset.ar, end: mk.dataset.end};
    editingDoc = k; try{ mk.setPointerCapture(e.pointerId); }catch(_){}
    return;
  }
  if (mapMode==="arrow" && !readOnly){
    e.preventDefault();
    drawing = {k, rect:R, pts:[mapXY(e,R)], sx:e.clientX, sy:e.clientY};
    editingDoc = k; try{ map.setPointerCapture(e.pointerId); }catch(_){}
    return;
  }
  const ar = e.target.closest("[data-ar]");
  if (ar){ mapSel = {k, type:"ar", id:ar.dataset.ar}; render(); }
  else if (mapSel){ mapSel = null; render(); }
});
document.addEventListener("pointermove", e=>{
  if (drawing){
    const R = drawing.rect; drawing.pts.push(mapXY(e,R));
    const l = document.getElementById("prev");
    if (l){ l.setAttribute("d","M"+drawing.pts.map(p=>(p[0]*R.width).toFixed(1)+" "+(p[1]*R.height).toFixed(1)).join("L")); l.setAttribute("visibility","visible"); }
    return;
  }
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy) < 6) return;
  if (readOnly) return;
  drag.moved = true; drag.el.classList.add("drag");
  [drag.x, drag.y] = mapXY(e,drag.rect);
  if (drag.type==="hd"){
    const a = (campo(drag.k).arrows||[]).find(x=>x.id===drag.id); if (!a) return;
    if (drag.end==="m"){ a.cx = 2*drag.x-(a.x1+a.x2)/2; a.cy = 2*drag.y-(a.y1+a.y2)/2; }
    else { a["x"+drag.end]=drag.x; a["y"+drag.end]=drag.y; }
    layoutArrows();
  } else { drag.el.style.left = pct(drag.x); drag.el.style.top = pct(drag.y); }
});
function endDrag(e){
  if (drawing){
    const d = drawing; drawing = null; editingDoc = null;
    const P = d.pts, W = d.rect.width, H = d.rect.height;
    if (e && e.type==="pointerup" && P.length>1){
      const p1 = P[0], p2 = P[P.length-1];
      if (Math.hypot((p2[0]-p1[0])*W,(p2[1]-p1[1])*H) > 24){
        const a = {id:rid(), x1:r4(p1[0]), y1:r4(p1[1]), x2:r4(p2[0]), y2:r4(p2[1])};
        // punto più lontano dalla corda: se la linea è curva diventa il punto medio della curva
        const ax=p1[0]*W, ay=p1[1]*H, bx=p2[0]*W, by=p2[1]*H, L=Math.hypot(bx-ax,by-ay);
        let best=null, bd=0;
        P.forEach(p=>{ const px=p[0]*W, py=p[1]*H, dd=Math.abs((bx-ax)*(ay-py)-(ax-px)*(by-ay))/L; if (dd>bd){ bd=dd; best=p; } });
        if (best && bd > 16){ a.cx = r4(2*best[0]-(p1[0]+p2[0])/2); a.cy = r4(2*best[1]-(p1[1]+p2[1])/2); }
        const f = campo(d.k); f.arrows = f.arrows||[]; f.arrows.push(a); touch(d.k);
      }
    }
    render(); applyQueued(d.k); return;
  }
  if (!drag) return; const d = drag; drag = null; d.el.classList.remove("drag");
  const f = campo(d.k);
  if (d.moved && !readOnly){
    if (d.type==="boat"){ f.pos = f.pos||{}; f.pos[d.id] = {x:r4(d.x),y:r4(d.y)}; }
    else if (d.type==="boa"){ const m = (f.marks||[]).find(x=>x.id===d.id); if (m){ m.x=r4(d.x); m.y=r4(d.y); } }
    else { const a = (f.arrows||[]).find(x=>x.id===d.id); if (a) ["x1","y1","x2","y2","cx","cy"].forEach(q=>{ if (a[q]!=null) a[q]=r4(a[q]); }); }
    touch(d.k);
  }
  editingDoc = null;
  if (!d.moved && d.type!=="hd"){ mapSel = {k:d.k, type:d.type, id:d.id}; }
  render();
  applyQueued(d.k);
}

function bgSVG(l,c1,c2){

function fitText(txt, maxW, maxSize, k=0.6){ return Math.max(3, Math.min(maxSize, maxW/Math.max(1,txt.length*k))); }
function emblemSVG(name,col,x,y,w,h){
  const s=Math.min(w,h), cx=x+w/2, cy=y+h/2, c=col||"#000000";
  const m = /^RS Aero (\w+)$/.exec(name);
  if (m) return `<circle cx="${cx}" cy="${cy}" r="${s/2}" fill="${col||"#E8359E"}"/><circle cx="${cx}" cy="${cy}" r="${s/2*0.74}" fill="#fff"/><text x="${cx}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="${s*0.46}" fill="#000">${esc(m[1])}</text>`;

  let lines = [name];
  if (name.length>9 && name.includes(" ")){ const mid=name.length/2; let best=-1; for(let i=0;i<name.length;i++) if(name[i]===" " && (best<0||Math.abs(i-mid)<Math.abs(best-mid))) best=i; lines=[name.slice(0,best),name.slice(best+1)]; }
  const ml = Math.max(...lines.map(l=>l.length));
  const fs = Math.min(s*0.34*(lines.length>1?0.85:1), (w*0.94)/(ml*0.62), (h*0.9)/(lines.length*1.1));
  return lines.map((l,i)=>`<text x="${cx}" y="${cy+(i-(lines.length-1)/2)*fs*1.05}" dominant-baseline="central" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-style="italic" font-size="${fs.toFixed(2)}" fill="${c}">${esc(l)}</text>`).join("");
}
function logoSVG(c,x,y,w,h){

}

/* ritaglio quadrato con zoom, spostamento e rimozione del bianco */
const CBOX = 280;
function removeWhite(img){
  const max = 1000, k = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
  const w = Math.max(1,Math.round(img.naturalWidth*k)), h = Math.max(1,Math.round(img.naturalHeight*k));
  const cv = document.createElement("canvas"); cv.width=w; cv.height=h; const x = cv.getContext("2d");
  x.drawImage(img,0,0,w,h);
  const d = x.getImageData(0,0,w,h), p = d.data;
  for (let i=0;i<p.length;i+=4){
    const a0 = p[i+3]/255; if (a0<=0) continue;
    const rr=p[i]/255, gg=p[i+1]/255, bb=p[i+2]/255, m=Math.min(rr,gg,bb);
    const alpha = Math.min(1,Math.max(0,(1-m-0.06)/0.94))*a0;
    if (alpha<0.02){ p[i]=p[i+1]=p[i+2]=p[i+3]=0; continue; }
    const dd = Math.max(0.0001,1-m);
    p[i]=Math.round(Math.min(1,Math.max(0,(rr-m)/dd))*255); p[i+1]=Math.round(Math.min(1,Math.max(0,(gg-m)/dd))*255);
    p[i+2]=Math.round(Math.min(1,Math.max(0,(bb-m)/dd))*255); p[i+3]=Math.round(alpha*255);
  }
  x.putImageData(d,0,0); return cv.toDataURL("image/png");
}
function cropFitted(o){ const ar = o.nw/Math.max(1,o.nh); return ar>1 ? [CBOX, CBOX/ar] : [CBOX*ar, CBOX]; }
function cropApply(){
  const o = sheetOpen, im = document.getElementById("cimg"); if (!o || !im) return;
  const [fw,fh] = cropFitted(o);
  im.style.width = fw+"px"; im.style.height = fh+"px";
  im.style.transform = `translate(-50%,-50%) translate(${o.ox}px,${o.oy}px) scale(${o.scale})`;
  const sl = document.getElementById("cscale"); if (sl && +sl.value!==o.scale) sl.value = o.scale;
}
function drawCropSheet(){
  const o = sheetOpen, c = curClass(); if (!c){ sheetOpen=null; $("#sheet").innerHTML=""; return; }
  const src = o.remove && o.processed ? o.processed : o.src;
  $("#sheet").innerHTML = sheetWrap(t("Ritaglia"), `
    <div class="cropbox" id="cbox" style="background:${o.remove?c.col:"#FFFFFF"}"><img id="cimg" src="${src}" alt="" draggable="false"></div>
    <div class="zoom"><span aria-hidden="true">−</span><input type="range" id="cscale" min="0.3" max="8" step="0.01" value="${o.scale}" aria-label="Zoom"><span aria-hidden="true">+</span></div>
    <label class="crow"><span class="l">${t("Rimuovi lo sfondo bianco")}</span><input type="checkbox" id="crem" ${o.remove?"checked":""}></label>
    <p class="hint">${t("Trascina e ingrandisci per inquadrare solo il logo. Con lo sfondo rimosso, l’anteprima usa il colore della bandiera.")}${o.remove&&!o.processed?" "+t("Elaborazione…"):""}</p>
    <div class="btnrow"><button class="btn pri" data-act="ce" data-k="cropUse">${t("Usa")}</button><button class="btn" data-act="ce" data-k="cropCancel">${t("Annulla")}</button></div>`, false);
  cropApply();
  $("#cscale").oninput = e => { o.scale = +e.target.value; cropApply(); };
  $("#crem").onchange = e => { o.remove = e.target.checked; drawCropSheet(); };
}
function cropOpen(file){
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const c = curClass(); if (!c) return;
      sheetOpen = {kind:"crop", id:c.id, src:fr.result, nw:im.naturalWidth, nh:im.naturalHeight, scale:1, ox:0, oy:0, remove:true, processed:null, img:im};
      drawSheet();
      setTimeout(()=>{ try{ const p = removeWhite(im); if (sheetOpen && sheetOpen.kind==="crop"){ sheetOpen.processed = p; const pim = new Image(); pim.onload=()=>{ if (sheetOpen&&sheetOpen.kind==="crop"){ sheetOpen.pimg=pim; drawSheet(); } }; pim.src = p; } }catch(e){} }, 30);
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function cropUse(){
  const o = sheetOpen, c = curClass(); if (!o || !c) return;
  const out = 320, k = out/CBOX, [fw,fh] = cropFitted(o);
  const cv = document.createElement("canvas"); cv.width = out; cv.height = out; const x = cv.getContext("2d");
  if (!o.remove){ x.fillStyle = "#FFFFFF"; x.fillRect(0,0,out,out); }
  const cw = fw*o.scale*k, ch = fh*o.scale*k, cx = out/2 + o.ox*k, cy = out/2 + o.oy*k;
  x.drawImage(o.remove && o.pimg ? o.pimg : o.img, cx-cw/2, cy-ch/2, cw, ch);
  c.logo = "img"; c.logoImg = cv.toDataURL("image/png");
  sheetOpen = null; drawSheet(); touch("config"); render();
}
/* gesti nel riquadro di ritaglio: trascina, pizzica, rotella */
const cptr = new Map(); let cpinch = null;
document.addEventListener("pointerdown", e=>{
  const box = e.target.closest("#cbox"); if (!box || !sheetOpen || sheetOpen.kind!=="crop") return;
  e.preventDefault(); try{ box.setPointerCapture(e.pointerId); }catch(_){}
  cptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (cptr.size===2){ const [a,b] = [...cptr.values()]; cpinch = {d:Math.hypot(a.x-b.x,a.y-b.y), s:sheetOpen.scale}; }
});
document.addEventListener("pointermove", e=>{
  if (!cptr.has(e.pointerId) || !sheetOpen || sheetOpen.kind!=="crop") return;
  const prev = cptr.get(e.pointerId); cptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (cptr.size>=2 && cpinch){ const [a,b] = [...cptr.values()]; sheetOpen.scale = Math.min(10,Math.max(0.3, cpinch.s*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,cpinch.d))); }
  else { sheetOpen.ox += e.clientX-prev.x; sheetOpen.oy += e.clientY-prev.y; }
  cropApply();
});
const cend = e => { cptr.delete(e.pointerId); if (cptr.size<2) cpinch = null; };
document.addEventListener("pointerup", cend); document.addEventListener("pointercancel", cend);
document.addEventListener("wheel", e=>{ if (!e.target.closest("#cbox") || !sheetOpen || sheetOpen.kind!=="crop") return; e.preventDefault(); sheetOpen.scale = Math.min(10,Math.max(0.3, sheetOpen.scale*Math.exp(-e.deltaY*0.0015))); cropApply(); }, {passive:false});
/* colore personalizzato */
document.addEventListener("input", e=>{
  if (e.target.dataset && e.target.dataset.ccol!=null && sheetOpen && sheetOpen.kind==="color"){
    const c = curClass(); if (!c) return; c[sheetOpen.key] = e.target.value.toUpperCase(); touch("config"); refreshPreview();
  }
});
document.addEventListener("change", e=>{
  if (e.target.dataset && e.target.dataset.logoimg!=null && e.target.files && e.target.files[0]){ cropOpen(e.target.files[0]); e.target.value=""; }
  if (e.target.dataset && e.target.dataset.ccol!=null && sheetOpen && sheetOpen.kind==="color"){ sheetOpen=null; drawSheet(); render(); }
});
function ceAct(ds){
  const c = curClass(); if (!c) return;
  switch(ds.k){
    case "style": c.style = ds.v; if (c.style==="intl" && !c.intl) c.intl = "A"; break;
    case "layout": c.layout = ds.v; break;
    case "intl": c.intl = ds.v; break;
    case "openColor": sheetOpen = {kind:"color", key:ds.v, id:c.id}; drawSheet(); return;
    case "setColor": if (sheetOpen) c[sheetOpen.key] = ds.v==="orig" ? null : ds.v; sheetOpen = null; drawSheet(); break;
    case "openLogo": sheetOpen = {kind:"logo", id:c.id}; drawSheet(); return;
    case "setLogo": c.logo = ds.v; if (ds.v!=="img") delete c.logoImg; sheetOpen = null; drawSheet(); break;
    case "cropUse": cropUse(); return;
    case "cropCancel": sheetOpen = null; drawSheet(); return;
    case "del": S.config.classi = S.config.classi.filter(x=>x.id!==c.id); touch("config"); location.hash = "bandiere"; return;
  }
  touch("config"); render();
}

const BOA_TIPI = ["Cilindrica","Conica","Tetraedro","Siluro","Sferica","Robotica","Altro"];
const b64u = u8 => { let s=""; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const unb64u = s => { s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length%4) s+="="; const b = atob(s), u = new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
async function packData(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream){ try{ const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer(); return "z"+b64u(new Uint8Array(buf)); }catch(e){} }
  return "j"+b64u(bytes);
}
async function unpackData(s){
  const kind = s[0]; let u = unb64u(s.slice(1));
  if (kind==="z") u = new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(u));
}
const baseURL = () => location.origin + location.pathname;
const PC = p => ({n:(p&&p.n)||"", t:(p&&p.t)||""});
async function shareLink(title, text, url){
  if (navigator.share){ try { await navigator.share({title, text, url}); return "ok"; } catch(e){ if (e && e.name==="AbortError") return "cancel"; } }
  try { await navigator.clipboard.writeText(text+"\n"+url); return "copied"; } catch(e){ return "fail"; }
}

function buildRequest(){
  const c = S.config, req = {app:"rc-req", v:1, id:rid()+rid(), ev:c.nome||"", date:new Date().toISOString(), e:{}, a:[]};
  if (REQSEL.has("ev.segreteria")) req.e.segreteria = PC(c.segreteria);
  if (REQSEL.has("ev.medico")) req.e.medico = PC(c.medico);
  if (REQSEL.has("ev.classifiche")) req.e.classifiche = (c.classifiche||[]).map(PC);
  if (REQSEL.has("ev.victor")) req.e.victor = c.victor||"";
  CAMPI.slice(0,S.config.n).forEach(([k,L,nome])=>{
    const f = campo(k), a = {k, L, nome, classi:f.classi||""}; let any = false;
    if (REQSEL.has(k+".resp")){ a.resp = PC(f.resp); any = true; }
    if (REQSEL.has(k+".cdr")){ a.cdr = {pres:PC(f.cdr.pres), comp:f.cdr.comp.map(PC)}; any = true; }

      need(14); head();

      rows.forEach((r,ri)=>{
        const cells = r.map((v,i)=>doc.splitTextToSize(D(v),ws[i]-3.6));
        const h = Math.max(...cells.map(c=>c.length))*4.1+2.8;
        if (need(h)) { head(); doc.setFont("helvetica","normal"); doc.setFontSize(9); }
        if (ri%2) { doc.setFillColor(247,249,251); doc.rect(M,y,CW,h,"F"); }
        doc.setTextColor(30,40,55);
        let xx=M; cells.forEach((c,i)=>{ doc.text(c,xx+1.8,y+4.3); xx+=ws[i]; });
        doc.setDrawColor(213,222,232); doc.setLineWidth(.2); doc.line(M,y+h,M+CW,y+h); y+=h;
      });
      y+=2;
    }
    const n = S.config.n, act = CAMPI.slice(0,n);
    const keys = which==="all" ? act.map(c=>c[0]) : [which];
    const tipi = Object.keys(TIPI).filter(t=>t!=="terra");

    if (which==="all"){
      doc.setFont("helvetica","bold"); doc.setFontSize(24); doc.setTextColor(15,39,64);
      doc.splitTextToSize(ev,CW).forEach(l=>{ doc.text(l,M,y+9); y+=10; });
      doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(90,107,126);
      doc.text(T(`${t("Organizzazione dei campi di regata")} - ${new Date().toLocaleDateString(LANG==="en"?"en-GB":"it-IT")}`),M,y+5); y+=12;
      h2(t("Contatti e canali"));
      const c = S.config, rows = [["VHF Victor", T(c.victor)?t("Canale")+" "+T(c.victor):"-", ""],[t("Segreteria"),c.segreteria.n,c.segreteria.t],[t("Medico"),c.medico.n,c.medico.t]];
      (c.classifiche||[]).forEach(p=>rows.push([t("Classifiche"),p.n,p.t]));
      table([{t:t("Ruolo"),w:3},{t:t("Nome"),w:5},{t:t("Telefono"),w:3}], rows);
      h2(t("Campi"));
      table([{t:t("Campo"),w:2},{t:t("Classi"),w:4},{t:"VHF",w:1.2},{t:t("Responsabile"),w:3.5},{t:t("Telefono"),w:2.6}],
        act.map(([k,,nome])=>{ const f=S[k]||defCampo(); return [nome,f.classi,f.vhf,f.resp.n,f.resp.t]; }));
      h2(t("Riepilogo mezzi"));
      const cnt=(k,t)=>(S[k]||defCampo()).mezzi.filter(m=>m.tipo===t).length;
      const rws = tipi.map(t=>{ const v=act.map(([k])=>cnt(k,t)); return [TIPI[t],...v.map(String),String(v.reduce((a,b)=>a+b,0))]; });
      const col = act.map(([k])=>tipi.reduce((a,t)=>a+cnt(k,t),0));
      rws.push([t("Totale"),...col.map(String),String(col.reduce((a,b)=>a+b,0))]);
      table([{t:t("Mezzo"),w:4},...act.map(c=>({t:c[2],w:1.6})),{t:t("Totale"),w:1.6}], rws);
    }

    for (const k of keys){
      const [,L,nome] = CAMPI.find(c=>c[0]===k), f = campo(k);
      if (which==="all" || k!==keys[0]) { doc.addPage(); y=M; }
      doc.addImage(await flagPNG(L),"PNG",M,y,21,14);
      doc.setFont("helvetica","bold"); doc.setFontSize(22); doc.setTextColor(15,39,64); doc.text(`${t("Campo")} ${nome}`,M+26,y+7);
      doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(90,107,126);
      doc.text(T([f.classi, f.vhf?`${t("VHF campo")} ${f.vhf}`:"", S.config.victor?`Victor ${S.config.victor}`:""].filter(Boolean).join("   |   ")) || ev, M+26, y+13);
      y += 20;
      if (which!=="all"){ doc.setFontSize(9); doc.text(ev,PW-M,M+3,{align:"right"}); }
      h2(t("Comitato di regata e responsabili"));
      const rr = [[t("Responsabile campo"),f.resp.n,f.resp.t],[t("Presidente comitato"),f.cdr.pres.n,f.cdr.pres.t]];
      f.cdr.comp.filter(p=>T(p.n)||T(p.t)).forEach(p=>rr.push([t("Componente"),p.n,p.t]));
      rr.push([t("Beach master"),f.beach.n,f.beach.t],[t("Sicurezza campo"),f.sicurezza.n,f.sicurezza.t],[t("Delegato di classe"),f.delegato.n,f.delegato.t]);
      table([{t:t("Ruolo"),w:3},{t:t("Nome"),w:5},{t:t("Telefono"),w:3}], rr);
      const mz = f.mezzi.filter(m=>m.tipo!=="terra");
      h2(t("Mezzi in acqua"));
      table([{t:t("Mezzo"),w:3.2},{t:t("Sigla"),w:1.2},{t:t("Imbarcazione"),w:2.6},{t:t("Responsabile"),w:3},{t:t("Telefono"),w:2.4},{t:t("Assistente"),w:3},{t:t("Telefono"),w:2.4}],
        mz.map(m=>[m.nome||TIPI[m.tipo],sigla(m),m.barca,m.resp.n,m.resp.t,m.ass.n,m.ass.t]));
      if ((f.boe||[]).length){
        h2(t("Boe"));
        table([{t:t("Boa"),w:3},{t:t("Colore"),w:3},{t:t("Quantita'"),w:1.6},{t:t("Tipo"),w:2.4}], f.boe.map(b=>[b.l,BNAME(b.c?t(b.c):""),String(b.q||""),b.tipo?t(b.tipo):(b.robo?t("Robotica"):"-")]));
        para(`${t("Totale boe:")} ${f.boe.reduce((a,b)=>a+(parseInt(b.q)||0),0)}`);
      }
      const map = await mapImage(k,f);
      if (map){
        let w = CW, h = map.H/map.W*w; const maxH = PH-2*M-20; if (h>maxH){ h=maxH; w=map.W/map.H*h; }
        need(h+14); h2(t("Percorso"));
        doc.addImage(map.url,"JPEG",M+(CW-w)/2,y,w,h); y+=h+4;
      }
      h2(t("Dotazioni e bandiere per mezzo"));
      for (const m of f.mezzi){
        const fl = Object.keys(m.fl||{}).filter(id=>FMAP[id]||allClasses().some(c=>c.id===id));
        const dots = (m.dot||[]).map(d=>T(d.t)).filter(Boolean);
        if (!fl.length && !dots.length) continue;
        need(12); doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(15,39,64);
        doc.text(T(`${m.nome||TIPI[m.tipo]}${m.tipo!=="terra"&&sigla(m)?" ("+sigla(m)+")":""}`),M,y+4); y+=6.5;
        if (dots.length) para(t("Dotazioni")+": "+dots.join(", "),9.5);
        if (fl.length){
          const per = 9, cw = CW/per;
          for (let i=0;i<fl.length;i+=per){
            need(16);
            for (let j=0;j<per && i+j<fl.length;j++){
              const id = fl[i+j], xx = M + j*cw;
              doc.addImage(await flagPNG(id),"PNG",xx+(cw-12)/2,y,12,8.1);
              doc.setFont("helvetica","normal"); doc.setFontSize(6.8); doc.setTextColor(60,72,88);
              doc.text(doc.splitTextToSize(T(flagName(id)),cw-1).slice(0,2),xx+cw/2,y+11,{align:"center"});
            }
            y+=16;
          }
        }
        y+=2;
      }
      if (T(f.note)){ h2(t("Note")); para(f.note); }
    }
    const np = doc.getNumberOfPages();
    for (let i=1;i<=np;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(120,130,145);
      doc.text(T(ev),M,PH-7); doc.text(`${t("Pagina")} ${i} ${t("di")} ${np}`,PW-M,PH-7,{align:"right"}); }
    const slug = (ev+(which==="all"?"":"-"+t("Campo").toLowerCase()+"-"+CAMPI.find(c=>c[0]===which)[2])).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "campi-regata";
    const blob = doc.output("blob");
    const r = await saveFile(blob, slug+".pdf");
    pdfMsg = r==="ok" ? t("PDF pronto.") : "";
  }catch(e){ console.error(e); pdfMsg = t("Non sono riuscito a creare il PDF. Riprova."); }
  pdfBusy = null; render();
}

/* ---------- eventi ---------- */
document.addEventListener("focusin", e=>{ const d=e.target.dataset&&e.target.dataset.d; if(d) editingDoc=d; });
document.addEventListener("focusout", e=>{ const d=e.target.dataset&&e.target.dataset.d; if(!d) return; setTimeout(()=>{ if(editingDoc===d && !(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.d===d)){ editingDoc=null; applyQueued(d);} },50); });

document.addEventListener("input", e=>{
  const t = e.target, d = t.dataset.d; if (!d || readOnly || t.type==="checkbox" || t.tagName==="SELECT") return;
  setP(docOf(d), t.dataset.p, t.value); touch(d);
  if (location.hash.startsWith("#ed-")) refreshPreview();
  if (d==="config" && /^classi\.\d+\.nome$/.test(t.dataset.p)){ const c=getP(S.config,t.dataset.p.replace(/\.nome$/,"")); const s=t.previousElementSibling; if(s&&c) s.outerHTML=flagSVG(c.id,48); }
  const mm = t.dataset.p.match(/^mezzi\.(\d+)\.(sigla|nome)$/);
  if (mm){ const m = campo(d).mezzi[+mm[1]]; const el = m && document.querySelector(`.mk[data-mk="${m.id}"] b`); if (el) el.textContent = sigla(m); }
  if (/\.t$/.test(t.dataset.p)){ const a = t.parentNode.querySelector(".call"); if (a){ a.href=telHref(t.value); a.hidden=!telOk(t.value); } }
});
document.addEventListener("change", e=>{
  if (e.target.dataset && e.target.dataset.climg!=null && e.target.files && e.target.files[0]){ classImg(+e.target.dataset.climg, e.target.files[0]); e.target.value=""; return; }
  if (e.target.dataset && e.target.dataset.imp!=null && e.target.files && e.target.files[0]){ readBackup(e.target.files[0]); e.target.value=""; return; }
  if (e.target.dataset && e.target.dataset.up){ const f=e.target.files&&e.target.files[0]; if (f) uploadImg(e.target.dataset.up,f); return; }
  const t = e.target, d = t.dataset.d; if (!d || readOnly) return;
  if (t.type==="checkbox") setP(docOf(d), t.dataset.p, t.checked);
  else if (t.tagName==="SELECT"){ setP(docOf(d), t.dataset.p, t.value); const mb = /^(boe\.\d+)\.tipo$/.exec(t.dataset.p); if (mb) getP(docOf(d), mb[1]).robo = t.value==="Robotica"; }
  else return;
  touch(d); render();
});

document.addEventListener("click", e=>{
  const tb = e.target.closest("[data-tab]"); if (tb){ tab=tb.dataset.tab; render(); return; }
  const sl = e.target.closest("[data-sel]"); if (sl){ selM=sl.dataset.sel; render(); return; }
  const tg = e.target.closest("[data-tog]");
  if (tg && sheetOpen && sheetOpen.kind!=="mz"){ const m = campo(sheetOpen.k).mezzi[sheetOpen.i], id = tg.dataset.tog;
    if (id in m.fl) delete m.fl[id]; else m.fl[id]=false; touch(sheetOpen.k); render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act==="closeSheet" && e.target!==b && b.classList.contains("sheet")) return;
  if (b.hasAttribute("data-confirm") && !b.classList.contains("armed")){
    b.classList.add("armed"); const old=b.textContent; b.textContent = b.dataset.act==="reset"?t("Tocca di nuovo per svuotare tutto"):t("Conferma");
    setTimeout(()=>{ if(b.isConnected){ b.classList.remove("armed"); b.textContent=old; } },3000); return;
  }
  act(b.dataset.act, b.dataset);
});

function addMezzo(f,tp){
  const n = f.mezzi.filter(m=>m.tipo===tp).length+1;
  const nm = tp==="gp"?`${t("Posaboe")} G${n}`:tp==="ga"?`${t("Assistenza")} A${n}`:TIPI[tp];
  const m = newMezzo(tp,nm); if (tp==="gp") m.sigla=`G${n}`; if (tp==="ga") m.sigla=`A${n}`;
  const ti = f.mezzi.findIndex(x=>x.tipo==="terra");
  if (ti>=0 && tp!=="terra") f.mezzi.splice(ti,0,m); else f.mezzi.push(m);
  return m;
}
function place(f){ const n = Object.keys(f.pos||{}).length; return {x:.5+((n%5)-2)*.08, y:.5+(Math.floor(n/5)%3-1)*.1}; }
function act(a, ds){
  if (["rqAll","rqSend","rqPaste","mdAdd","mdSend","rsImport"].includes(a)) return circoloAct(a, ds);
  const h = location.hash.slice(1), i = +ds.i;
  const F = () => campo(h);
  switch(a){
    case "n": S.config.n = Math.min(6,Math.max(1,S.config.n + +ds.v)); touch("config"); break;
    case "addCl": S.config.classifiche.push(P()); touch("config"); break;
    case "rmCl": S.config.classifiche.splice(i,1); touch("config"); break;
    case "addClasse": { const c = newClassFlag(); (S.config.classi=S.config.classi||[]).push(c); touch("config"); location.hash = "ed-"+c.id; return; }
    case "ce": ceAct(ds); return;
    case "libExport": exportLib(); return;
    case "dupLib": dupLib(ds.id); return;
    case "rmClasse": S.config.classi.splice(i,1); touch("config"); break;
    case "rmClImg": if (S.config.classi[i]) delete S.config.classi[i].img; touch("config"); break;
    case "addComp": F().cdr.comp.push(P()); touch(h); break;
    case "rmComp": F().cdr.comp.splice(i,1); touch(h); break;
    case "addMz": { const m = addMezzo(F(), $("#nt").value); touch(h); render();
      const el = document.getElementById("mz-"+m.id); if (el){ el.scrollIntoView({block:"center"}); const q=el.querySelector('[data-p$=".resp.n"]'); if(q) q.focus({preventScroll:true}); } return; }
    case "rmMz": { const f=F(), m=f.mezzi[i]; if (f.pos&&m) delete f.pos[m.id]; f.mezzi.splice(i,1); touch(h); break; }
    case "rmMzId": { const f=F(), j=f.mezzi.findIndex(m=>m.id===ds.id); if (j>=0) f.mezzi.splice(j,1); if (f.pos) delete f.pos[ds.id]; sheetOpen=null; drawSheet(); touch(h); break; }
    case "addMk": { const f=F(), m=addMezzo(f, ds.t); f.pos=f.pos||{}; f.pos[m.id]=place(f); touch(h); sheetOpen={kind:"mz",k:h,id:m.id}; break; }
    case "place": { const f=F(); f.pos=f.pos||{}; f.pos[ds.id]=place(f); touch(h); if (sheetOpen&&sheetOpen.kind==="mz") { sheetOpen=null; drawSheet(); } break; }
    case "unplace": { const f=F(); if (f.pos) delete f.pos[ds.id]; mapSel=null; touch(h); break; }
    case "openMz": sheetOpen={kind:"mz",k:h,id:ds.id}; drawSheet(); return;
    case "straight": { const a=(F().arrows||[]).find(x=>mapSel&&x.id===mapSel.id); if (a){ delete a.cx; delete a.cy; touch(h); } break; }
    case "rmSel": { const f=F(); if (!mapSel) break;
      if (mapSel.type==="ar") f.arrows=(f.arrows||[]).filter(a=>a.id!==mapSel.id);
      else if (mapSel.type==="boa") f.marks=(f.marks||[]).filter(m=>m.id!==mapSel.id);
      else if (mapSel.type==="boat" && f.pos) delete f.pos[mapSel.id];
      mapSel=null; touch(h); break; }
    case "lang": LANG = ds.v; try{ localStorage.setItem("racecourse-lang",LANG); }catch(e){} buildI18n(); break;
    case "bkExport": exportBackup(); return;
    case "bkApply": applyBackup(); return;
    case "bkCancel": pendingImport=null; break;
    case "pdf": exportPDF(ds.k); return;
    case "mode": mapMode = ds.v; mapSel = null; break;
    case "placeBoa": { const f=F(); f.marks=f.marks||[]; const b=boaInfo(f,ds.l); const n=f.marks.length;
      f.marks.push({id:rid(),l:ds.l,c:b.c,robo:b.robo,x:r4(.3+(n%6)*.08),y:r4(.25+(Math.floor(n/6)%4)*.1)}); touch(h); break; }
    case "rmMark": { const f=F(); f.marks=(f.marks||[]).filter(m=>!(mapSel&&m.id===mapSel.id)); mapSel=null; touch(h); break; }
    case "flipAr": { const a=(F().arrows||[]).find(x=>mapSel&&x.id===mapSel.id); if (a){ [a.x1,a.x2]=[a.x2,a.x1]; [a.y1,a.y2]=[a.y2,a.y1]; touch(h); } break; }
    case "rmAr": { const f=F(); f.arrows=(f.arrows||[]).filter(a=>!(mapSel&&a.id===mapSel.id)); mapSel=null; touch(h); break; }
    case "rmAllAr": { F().arrows=[]; mapSel=null; touch(h); break; }
    case "rmImg": { const f=F(); f.img=null; clearImg(h); touch(h); break; }
    case "addBoa": F().boe.push({l:"",c:"",q:1,robo:false}); touch(h); break;
    case "rmBoa": F().boe.splice(i,1); touch(h); break;
    case "addDot": { const v=$("#nd").value.trim(); if(!v) { $("#nd").focus(); return; } F().mezzi[i].dot.push({t:v,ok:false}); touch(h); break; }
    case "rmDot": F().mezzi[i].dot.splice(+ds.j,1); touch(h); break;
    case "clrDot": F().mezzi[i].dot.forEach(x=>x.ok=false); touch(h); break;
    case "clrFl": { const fl=F().mezzi[i].fl; Object.keys(fl).forEach(id=>fl[id]=false); touch(h); break; }
    case "openSheet": sheetOpen={kind:"fl",k:h,i}; drawSheet(); return;
    case "closeSheet": sheetOpen=null; drawSheet(); return;
    case "reset": { CAMPI.forEach(([k])=>clearImg(k)); const keep = S.config.classi||[]; S.config = defConfig(); S.config.classi = keep; touch("config");
      CAMPI.forEach(([k])=>{ if (S[k]) { S[k]=defCampo(); touch(k); } }); location.hash=""; break; }
  }
  render();
}

const ACCESS = "936493c4d3ee570bc38139bb850d803962d4e6092a31ea152892635c6443cdfb";
const AKEY = "racecourse-access";
async function hashCode(c){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("racecourse:"+c)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function hasAccess(){ try{ return localStorage.getItem(AKEY)===ACCESS; }catch(e){ return false; } }
function showGate(msg){
  document.title = "Racecourse";
  $("#app").innerHTML = `<form class="gate" id="gate"><div class="box"><img src="icons/icon-192.png" alt=""><h1>Racecourse</h1>
    <p>${t("Inserisci il codice che ti ha dato l’organizzazione.")}</p>
    <input class="inp" id="code" type="password" autocomplete="current-password" autocapitalize="characters" spellcheck="false" placeholder="${t("Codice di accesso")}" aria-label="${t("Codice di accesso")}">
    <button class="btn pri" type="submit">${t("Entra")}</button>
    <div class="err" role="alert">${msg||""}</div>
    <div class="gl"><button type="button" data-glang="it" aria-pressed="${LANG==="it"}">IT</button><button type="button" data-glang="en" aria-pressed="${LANG==="en"}">EN</button></div>
  </div></form>`;
  const f = $("#gate"), c = $("#code"); c.focus();
  f.onsubmit = async ev => { ev.preventDefault();
    const h = await hashCode(c.value.trim().toUpperCase());
    if (h===ACCESS){ try{ localStorage.setItem(AKEY,h); }catch(e){} render(); }
    else showGate(t("Codice non corretto."));
  };
  f.querySelectorAll("[data-glang]").forEach(b=>b.onclick=()=>{ LANG=b.dataset.glang; try{ localStorage.setItem("racecourse-lang",LANG); }catch(e){} buildI18n(); showGate(); });
}
buildI18n();
loadLib();
if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
window.addEventListener("hashchange", ()=>{ sheetOpen=null; mapSel=null; mapMode="move"; drawSheet(); selM=null; tab="squadra"; render(); window.scrollTo(0,0); });
render();
</script>
